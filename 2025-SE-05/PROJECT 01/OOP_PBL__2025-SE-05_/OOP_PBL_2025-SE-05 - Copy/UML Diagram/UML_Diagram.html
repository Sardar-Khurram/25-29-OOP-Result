<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkyLink Airways - UML Class Diagram</title>
<style>
  body {
    background: #1e1e2e;
    font-family: 'Courier New', monospace;
    margin: 0; padding: 20px;
    color: #cdd6f4;
  }
  h1 { text-align:center; color:#89b4fa; font-size:20px; margin-bottom:4px; }
  p.sub { text-align:center; color:#a6adc8; font-size:13px; margin-bottom:16px; }
  svg { display:block; margin:auto; }
</style>
</head>
<body>
<h1>SkyLink Airways — UML Class Diagram</h1>
<p class="sub">Airline Reservation &amp; Flight Management System (C++ OOP)</p>

<svg viewBox="0 0 1150 950" xmlns="http://www.w3.org/2000/svg" width="1100">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#89b4fa"/>
  </marker>
  <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#f38ba8"/>
  </marker>
  <marker id="dia" markerWidth="14" markerHeight="9" refX="0" refY="4.5" orient="auto">
    <polygon points="0 4.5,7 0,14 4.5,7 9" fill="#f9e2af"/>
  </marker>
  <marker id="dash-arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="none" stroke="#fab387" stroke-width="1.5"/>
  </marker>
</defs>

<!-- ════════════════════════════════════════════
     FLIGHT  (abstract)  — top-center
════════════════════════════════════════════ -->
<rect x="400" y="10" width="270" height="190" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
<rect x="400" y="10" width="270" height="30" rx="5" fill="#89b4fa"/>
<text x="535" y="30" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">«abstract»  Flight</text>
<line x1="400" y1="40" x2="670" y2="40" stroke="#585b70"/>
<text x="412" y="56"  fill="#cba6f7" font-size="11">- flightNumber  : string</text>
<text x="412" y="70"  fill="#cba6f7" font-size="11">- origin        : string</text>
<text x="412" y="84"  fill="#cba6f7" font-size="11">- destination   : string</text>
<text x="412" y="98"  fill="#cba6f7" font-size="11">- departureDate : string  (YYYY-MM-DD)</text>
<text x="412" y="112" fill="#cba6f7" font-size="11">- departureTime : string  (HH:MM)</text>
<text x="412" y="126" fill="#cba6f7" font-size="11">- totalSeats    : int</text>
<text x="412" y="140" fill="#cba6f7" font-size="11">- availableSeats: int</text>
<line x1="400" y1="148" x2="670" y2="148" stroke="#585b70"/>
<text x="412" y="163" fill="#a6e3a1" font-size="11">+ calculateBaseFare() : double  «pure virtual»</text>
<text x="412" y="177" fill="#a6e3a1" font-size="11">+ displayDetails()    : void    «pure virtual»</text>
<text x="412" y="191" fill="#a6e3a1" font-size="11">+ bookSeat() / cancelSeat() : bool</text>

<!-- ── DomesticFlight ── -->
<rect x="20" y="290" width="245" height="130" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.8"/>
<rect x="20" y="290" width="245" height="26" rx="4" fill="#45475a"/>
<text x="143" y="308" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">DomesticFlight</text>
<line x1="20" y1="316" x2="265" y2="316" stroke="#585b70"/>
<text x="30" y="331" fill="#cba6f7" font-size="11">- region  : string  (e.g. Northern)</text>
<text x="30" y="345" fill="#cba6f7" font-size="11">- taxRate : double  (e.g. 5.0 %)</text>
<line x1="20" y1="353" x2="265" y2="353" stroke="#585b70"/>
<text x="30" y="368" fill="#a6e3a1" font-size="11">+ calculateBaseFare() : double</text>
<text x="30" y="382" fill="#a6e3a1" font-size="11">+ displayDetails()    : void</text>
<text x="30" y="396" fill="#a6e3a1" font-size="11">+ getFlightType()  →  "Domestic"</text>
<!-- inheritance arrow -->
<line x1="143" y1="290" x2="460" y2="200" stroke="#89b4fa" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ── InternationalFlight ── -->
<rect x="390" y="290" width="270" height="140" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.8"/>
<rect x="390" y="290" width="270" height="26" rx="4" fill="#45475a"/>
<text x="525" y="308" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">InternationalFlight</text>
<line x1="390" y1="316" x2="660" y2="316" stroke="#585b70"/>
<text x="400" y="331" fill="#cba6f7" font-size="11">- country            : string  (e.g. UAE)</text>
<text x="400" y="345" fill="#cba6f7" font-size="11">- visaRequired       : bool   (1=Yes 0=No)</text>
<text x="400" y="359" fill="#cba6f7" font-size="11">- internationalSurcharge : double</text>
<line x1="390" y1="366" x2="660" y2="366" stroke="#585b70"/>
<text x="400" y="381" fill="#a6e3a1" font-size="11">+ calculateBaseFare() : double</text>
<text x="400" y="395" fill="#a6e3a1" font-size="11">+ displayDetails()    : void</text>
<text x="400" y="409" fill="#a6e3a1" font-size="11">+ getFlightType()  →  "International"</text>
<line x1="525" y1="290" x2="535" y2="200" stroke="#89b4fa" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ── CharterFlight ── -->
<rect x="690" y="290" width="240" height="130" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.8"/>
<rect x="690" y="290" width="240" height="26" rx="4" fill="#45475a"/>
<text x="810" y="308" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">CharterFlight</text>
<line x1="690" y1="316" x2="930" y2="316" stroke="#585b70"/>
<text x="700" y="331" fill="#cba6f7" font-size="11">- contractHolder : string</text>
<text x="700" y="345" fill="#cba6f7" font-size="11">- charterFee     : double  (flat fee)</text>
<line x1="690" y1="353" x2="930" y2="353" stroke="#585b70"/>
<text x="700" y="368" fill="#a6e3a1" font-size="11">+ calculateBaseFare() : double</text>
<text x="700" y="382" fill="#a6e3a1" font-size="11">+ displayDetails()    : void</text>
<text x="700" y="396" fill="#a6e3a1" font-size="11">+ getFlightType()  →  "Charter"</text>
<line x1="810" y1="290" x2="610" y2="200" stroke="#89b4fa" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- extends label -->
<text x="290" y="255" fill="#f9e2af" font-size="11" font-style="italic">extends (inheritance)</text>

<!-- ════════════════════════════════════════════
     PASSENGER (abstract) — right column
════════════════════════════════════════════ -->
<rect x="960" y="10" width="180" height="210" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="2.5"/>
<rect x="960" y="10" width="180" height="30" rx="5" fill="#f38ba8"/>
<text x="1050" y="30" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">«abstract»</text>
<text x="1050" y="44" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">Passenger</text>
<line x1="960" y1="50" x2="1140" y2="50" stroke="#585b70"/>
<text x="970" y="65"  fill="#cba6f7" font-size="10">- passengerID  : string</text>
<text x="970" y="78"  fill="#cba6f7" font-size="10">- name         : string</text>
<text x="970" y="91"  fill="#cba6f7" font-size="10">- email        : string</text>
<text x="970" y="104" fill="#cba6f7" font-size="10">- phone        : string</text>
<text x="970" y="117" fill="#cba6f7" font-size="10">- loyaltyPoints: int</text>
<line x1="960" y1="124" x2="1140" y2="124" stroke="#585b70"/>
<text x="970" y="138" fill="#a6e3a1" font-size="10">+ getBaggageAllowance() «pure»</text>
<text x="970" y="151" fill="#a6e3a1" font-size="10">+ getLoyaltyMultiplier()«pure»</text>
<text x="970" y="164" fill="#a6e3a1" font-size="10">+ getCancellationRefund()«pure»</text>
<text x="970" y="177" fill="#a6e3a1" font-size="10">+ addLoyaltyPoints(fare)</text>
<text x="970" y="190" fill="#a6e3a1" font-size="10">+ operator&lt;&lt;</text>
<text x="970" y="203" fill="#a6e3a1" font-size="10">+ serialize() : string</text>

<!-- EconomyPassenger -->
<rect x="780" y="530" width="230" height="120" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.8"/>
<rect x="780" y="530" width="230" height="26" rx="4" fill="#45475a"/>
<text x="895" y="548" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">EconomyPassenger</text>
<line x1="780" y1="556" x2="1010" y2="556" stroke="#585b70"/>
<text x="790" y="571" fill="#a6e3a1" font-size="10">+ getBaggageAllowance() → 20 kg</text>
<text x="790" y="584" fill="#a6e3a1" font-size="10">+ getLoyaltyMultiplier()→ 1x</text>
<text x="790" y="597" fill="#a6e3a1" font-size="10">+ getCancellationRefund(days):</text>
<text x="800" y="610" fill="#fab387" font-size="10">  &gt;7 days→50% | 3-7→25% | &lt;3→0%</text>
<text x="790" y="623" fill="#a6e3a1" font-size="10">+ getPassengerClass()→"Economy"</text>
<text x="790" y="636" fill="#a6e3a1" font-size="10">+ displayDetails() / serialize()</text>

<!-- BusinessPassenger -->
<rect x="780" y="680" width="230" height="120" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.8"/>
<rect x="780" y="680" width="230" height="26" rx="4" fill="#45475a"/>
<text x="895" y="698" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">BusinessPassenger</text>
<line x1="780" y1="706" x2="1010" y2="706" stroke="#585b70"/>
<text x="790" y="721" fill="#a6e3a1" font-size="10">+ getBaggageAllowance() → 40 kg</text>
<text x="790" y="734" fill="#a6e3a1" font-size="10">+ getLoyaltyMultiplier()→ 2x</text>
<text x="790" y="747" fill="#a6e3a1" font-size="10">+ getCancellationRefund(days):</text>
<text x="800" y="760" fill="#fab387" font-size="10">  &gt;5 days→75% | 2-5→50% | &lt;2→20%</text>
<text x="790" y="773" fill="#a6e3a1" font-size="10">+ getPassengerClass()→"Business"</text>
<text x="790" y="786" fill="#a6e3a1" font-size="10">+ displayDetails() / serialize()</text>

<!-- FirstClassPassenger -->
<rect x="780" y="830" width="230" height="110" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.8"/>
<rect x="780" y="830" width="230" height="26" rx="4" fill="#45475a"/>
<text x="895" y="848" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">FirstClassPassenger</text>
<line x1="780" y1="856" x2="1010" y2="856" stroke="#585b70"/>
<text x="790" y="871" fill="#a6e3a1" font-size="10">+ getBaggageAllowance() → 60 kg</text>
<text x="790" y="884" fill="#a6e3a1" font-size="10">+ getLoyaltyMultiplier()→ 3x</text>
<text x="790" y="897" fill="#a6e3a1" font-size="10">+ getCancellationRefund(days):</text>
<text x="800" y="910" fill="#fab387" font-size="10">  &gt;3 days→90% | 1-3→70% | &lt;1→40%</text>
<text x="790" y="923" fill="#a6e3a1" font-size="10">+ getPassengerClass()→"FirstClass"</text>

<!-- Passenger inheritance arrows -->
<line x1="895" y1="530" x2="1010" y2="220" stroke="#f38ba8" stroke-width="1.8" marker-end="url(#arr2)"/>
<line x1="895" y1="680" x2="1020" y2="220" stroke="#f38ba8" stroke-width="1.8" marker-end="url(#arr2)"/>
<line x1="895" y1="830" x2="1030" y2="220" stroke="#f38ba8" stroke-width="1.8" marker-end="url(#arr2)"/>
<text x="1010" y="380" fill="#f9e2af" font-size="11" font-style="italic">extends</text>

<!-- ════════════════════════════════════════════
     TICKET
════════════════════════════════════════════ -->
<rect x="390" y="530" width="270" height="185" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="2.5"/>
<rect x="390" y="530" width="270" height="30" rx="5" fill="#a6e3a1"/>
<text x="525" y="550" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Ticket</text>
<line x1="390" y1="560" x2="660" y2="560" stroke="#585b70"/>
<text x="402" y="575" fill="#cba6f7" font-size="11">- ticketID      : string  (e.g. TKT-1001)</text>
<text x="402" y="589" fill="#cba6f7" font-size="11">- passengerID  : string  (links Passenger)</text>
<text x="402" y="603" fill="#cba6f7" font-size="11">- flightNumber : string  (links Flight)</text>
<text x="402" y="617" fill="#cba6f7" font-size="11">- seatNumber   : string  (e.g. S1, S2)</text>
<text x="402" y="631" fill="#cba6f7" font-size="11">- farePaid     : double</text>
<text x="402" y="645" fill="#cba6f7" font-size="11">- status       : BookingStatus (CONFIRMED/CANCELLED)</text>
<line x1="390" y1="652" x2="660" y2="652" stroke="#585b70"/>
<text x="402" y="667" fill="#a6e3a1" font-size="11">+ cancel()      : void</text>
<text x="402" y="681" fill="#a6e3a1" font-size="11">+ operator==()  : bool   (compare by ticketID)</text>
<text x="402" y="695" fill="#a6e3a1" font-size="11">+ operator&lt;&lt;   (print ticket info)</text>
<text x="402" y="709" fill="#a6e3a1" font-size="11">+ serialize()   : string</text>

<!-- ════════════════════════════════════════════
     AIRLINE
════════════════════════════════════════════ -->
<rect x="20" y="470" width="330" height="280" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="2.5"/>
<rect x="20" y="470" width="330" height="30" rx="5" fill="#f9e2af"/>
<text x="185" y="490" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Airline</text>
<line x1="20" y1="500" x2="350" y2="500" stroke="#585b70"/>
<text x="32" y="516" fill="#cba6f7" font-size="11">- airlineName  : string</text>
<text x="32" y="530" fill="#cba6f7" font-size="11">- flights      : vector&lt;unique_ptr&lt;Flight&gt;&gt;</text>
<text x="32" y="544" fill="#cba6f7" font-size="11">- passengers   : vector&lt;unique_ptr&lt;Passenger&gt;&gt;</text>
<text x="32" y="558" fill="#cba6f7" font-size="11">- tickets      : vector&lt;unique_ptr&lt;Ticket&gt;&gt;</text>
<text x="32" y="572" fill="#cba6f7" font-size="11">- flightRevenue: map&lt;string, double&gt;</text>
<line x1="20" y1="579" x2="350" y2="579" stroke="#585b70"/>
<text x="32" y="594" fill="#a6e3a1" font-size="11">+ addFlight()      / removeFlight()</text>
<text x="32" y="608" fill="#a6e3a1" font-size="11">+ addPassenger()   / removePassenger()</text>
<text x="32" y="622" fill="#a6e3a1" font-size="11">+ searchFlightByNumber()</text>
<text x="32" y="636" fill="#a6e3a1" font-size="11">+ bookTicket()    : Ticket*</text>
<text x="32" y="650" fill="#a6e3a1" font-size="11">+ cancelTicket()  : double  (refund amt)</text>
<text x="32" y="664" fill="#a6e3a1" font-size="11">+ reportTodaysDepartures()</text>
<text x="32" y="678" fill="#a6e3a1" font-size="11">+ reportOccupancyPerFlight()</text>
<text x="32" y="692" fill="#a6e3a1" font-size="11">+ reportTop5RevenueFlights()</text>
<text x="32" y="706" fill="#a6e3a1" font-size="11">+ saveToFile()    / loadFromFile()</text>
<text x="32" y="720" fill="#a6e3a1" font-size="11">+ listAllFlights() / listAllPassengers()</text>

<!-- Airline --aggregates--> Flight -->
<line x1="350" y1="510" x2="400" y2="105" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="7,3" marker-start="url(#dia)"/>
<text x="358" y="320" fill="#89b4fa" font-size="10" font-style="italic">aggregates</text>
<text x="358" y="332" fill="#89b4fa" font-size="10" font-style="italic">(has flights)</text>

<!-- Airline --aggregates--> Passenger -->
<line x1="350" y1="525" x2="960" y2="100" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="7,3" marker-start="url(#dia)"/>
<text x="560" y="448" fill="#f38ba8" font-size="10" font-style="italic">aggregates (has passengers)</text>

<!-- Airline --aggregates--> Ticket -->
<line x1="350" y1="600" x2="390" y2="610" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="7,3" marker-start="url(#dia)"/>

<!-- ════════════════════════════════════════════
     SearchUtils (Template)
════════════════════════════════════════════ -->
<rect x="20" y="790" width="330" height="90" rx="4" fill="#313244" stroke="#fab387" stroke-width="1.8" stroke-dasharray="7,3"/>
<rect x="20" y="790" width="330" height="26" rx="4" fill="#45475a"/>
<text x="185" y="808" text-anchor="middle" fill="#fab387" font-size="13" font-weight="bold">«template»  SearchUtils &lt;T&gt;</text>
<line x1="20" y1="816" x2="350" y2="816" stroke="#585b70"/>
<text x="32" y="831" fill="#a6e3a1" font-size="11">+ searchByPredicate(collection, pred) : T*</text>
<text x="32" y="845" fill="#a6e3a1" font-size="11">+ searchAllByPredicate(collection, pred) : vector&lt;T*&gt;</text>
<text x="32" y="859" fill="#fab387" font-size="10">  STL used: find_if, copy_if, sort, back_inserter</text>
<!-- Airline uses SearchUtils -->
<line x1="185" y1="790" x2="185" y2="750" stroke="#fab387" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="190" y="773" fill="#fab387" font-size="10" font-style="italic">«uses»</text>

<!-- ════════════════════════════════════════════
     Exceptions box
════════════════════════════════════════════ -->
<rect x="390" y="760" width="350" height="110" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.8" stroke-dasharray="7,3"/>
<rect x="390" y="760" width="350" height="26" rx="4" fill="#45475a"/>
<text x="565" y="778" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">«exceptions»  (custom classes)</text>
<line x1="390" y1="786" x2="740" y2="786" stroke="#585b70"/>
<text x="402" y="801" fill="#fab387" font-size="11">FlightFullException</text>
<text x="565" y="801" fill="#a6adc8" font-size="10">→ flight has no seats left</text>
<text x="402" y="815" fill="#fab387" font-size="11">DuplicateBookingException</text>
<text x="565" y="815" fill="#a6adc8" font-size="10">→ already booked same flight</text>
<text x="402" y="829" fill="#fab387" font-size="11">InvalidCancellationException</text>
<text x="565" y="829" fill="#a6adc8" font-size="10">→ ticket already cancelled</text>
<text x="402" y="843" fill="#fab387" font-size="11">NotFoundException</text>
<text x="565" y="843" fill="#a6adc8" font-size="10">→ flight/passenger not found</text>
<!-- Airline throws -->
<line x1="350" y1="660" x2="390" y2="790" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="352" y="740" fill="#f38ba8" font-size="10" font-style="italic">«throws»</text>

<rect x="780" y="480" width="350" height="42" rx="4" fill="#181825" stroke="#585b70"/>
<text x="955" y="496" text-anchor="middle" fill="#a6adc8" font-size="11" font-weight="bold">Legend</text>
<line x1="795" y1="508" x2="830" y2="508" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr)"/>
<text x="835" y="512" fill="#cdd6f4" font-size="10">Inheritance</text>
<line x1="900" y1="508" x2="935" y2="508" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="6,3" marker-start="url(#dia)"/>
